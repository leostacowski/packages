name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create GitHub release from package.json version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json - nothing to release."
            exit 0
          fi

          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          tag="v$version"

          if [ "$version" = "0.0.0" ]; then
            echo "Version is still 0.0.0 - bump it before releasing."
            exit 0
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - nothing to do."
            exit 0
          fi

          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --generate-notes --title "$tag"
          else
            gh release create "$tag" --generate-notes --title "$tag"
          fi
